# Controlli del backoffice (D92, D116), solo quando cambia backoffice/ o questo file: lint, formato,
# tipi, test dei componenti e dei gestori lato server, build. Le prove end to end girano sul
# sistema vero (D240): admin-api di questo stesso commit con PostgreSQL, Redis e Mailpit come
# servizi di GitHub Actions (in locale niente Docker, D237); si avviano a mano o con la variabile
# del repository BACKOFFICE_E2E=true, finché admin-api non manda le email via SMTP.
name: Backoffice

on:
  pull_request:
    branches: [main]
    paths:
      - 'backoffice/**'
      - '.github/workflows/backoffice.yml'
  push:
    branches: [main]
    paths:
      - 'backoffice/**'
      - '.github/workflows/backoffice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backoffice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backoffice

jobs:
  check:
    name: Lint, tipi, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepara Node dalla versione di .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backoffice/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Lint, formato, tipi e test
        run: npm run check

      - name: Compila
        run: npm run build

      - name: Dipendenze senza vulnerabilità alte
        run: npm audit --audit-level=high

  e2e:
    name: Prove end to end (Playwright) contro admin-api vera
    if: github.event_name == 'workflow_dispatch' || vars.BACKOFFICE_E2E == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: swipe_slide_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/swipe_slide_e2e
      REDIS_URL: redis://localhost:6379
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      E2E_OPERATOR_EMAIL: admin@backoffice.example
      E2E_MAILPIT_URL: http://localhost:8025
      ADMIN_API_URL: http://localhost:3001
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepara Node dalla versione di .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backoffice/package-lock.json

      - name: Chiavi di sviluppo casuali del backend
        working-directory: .
        run: |
          for key in JWT_ACCESS_SIGNING_KEY JWT_ADMIN_SIGNING_KEY HMAC_SECRET TOKEN_ENCRYPTION_KEY; do
            echo "$key=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          done

      - name: Backend - dipendenze, build, migrazioni e seed
        working-directory: .
        run: |
          npm ci
          npm run build
          node dist/cli/migrate.js
          node dist/cli/seed.js

      - name: Backend - avvia admin-api sulla porta 3001
        working-directory: .
        run: |
          SERVICE_ROLE=admin DATABASE_ROLE=backoffice_role PORT=3001 nohup node dist/main.js > admin-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:3001/health && exit 0
            sleep 1
          done
          cat admin-api.log
          exit 1

      - name: Backoffice - dipendenze e browser di Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Prove end to end
        run: npm run test:e2e

      - name: Report di Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: backoffice/playwright-report/
          retention-days: 7
